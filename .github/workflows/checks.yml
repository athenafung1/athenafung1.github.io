name: Checks

# Pull-request quality gates (constitution: Development Workflow and Quality Gates).
# Never deploys; pages.yml is the only deploy path.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx astro check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Content gate (placeholders, privacy, titles, descriptions)
        run: node scripts/check-content.mjs

      - name: Internal links (blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/dist --index-files index.html dist/

      - name: External links (non-blocking)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          args: --no-progress --root-dir ${{ github.workspace }}/dist --index-files index.html dist/
          fail: false

      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true
