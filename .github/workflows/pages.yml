name: Deploy to GitHub Pages

# The single deploy path (constitution v1.3.0). Builds the Astro site from src/ and public/
# and publishes the build output in dist/ only. Everything else in the repository is never
# uploaded and never reachable on the web: the hand-written site/ (a frozen, unpublished record
# of the previous site), archive/, specs/, .specify/ and docs.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v6

      # dist/ is build output, never committed or hand-edited.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v5
